name: Slovolov web i Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: slovolov-pwa
          path: web-app/dist

  android:
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: web-app/android
      - uses: actions/upload-artifact@v4
        with:
          name: Slovolov-Android
          path: web-app/android/app/build/outputs/apk/debug/app-debug.apk
